schemaVersion: 2
protocolVersion: draft-1
status: gate1rr_frozen_candidate

protocolLifetime:
  accessMode: one_shot_per_protocol
  maximumGateUnlocks: 1
  nonAdaptiveReplicationAllowed: false
  methodArmManifestSetHash: FREEZE_BEFORE_FIRST_GATE_ACCESS
  selectionRuleHash: FREEZE_BEFORE_FIRST_GATE_ACCESS
  reportTemplateSetHash: FREEZE_BEFORE_FIRST_GATE_ACCESS
  analysisProgramHash: FREEZE_BEFORE_FIRST_GATE_ACCESS
  laterConfirmatoryProtocolRequiresFreshGateSplit: true
  sameGateBecomesExploratoryAfterAuthorizedHumanRelease: true

candidateBatch:
  generationSource: mine_only
  maximumCandidatesPerMethod: 5
  adaptiveReplacementCandidates: 0
  proposalSeeds:
    - 1729
    - 271828
    - 314159
    - 161803
    - 57721
  batchMustBeContentAddressedBeforeGate: true

gateEvaluation:
  maximumBatchesPerMethod: 1
  maximumEvaluationsPerCandidate: 1
  taskOrderCommitmentBeforeRun: true
  proposerRunningDuringGate: false
  proposerWriteCapabilityRevokedBeforeGate: true
  proposerProviderCapabilityRevokedBeforeGate: true

selection:
  actor: promoter
  rule: frozen_lexicographic_gate_rule
  ties:
    - zero_safety_permission_data_access_violations
    - highest_gate_pass_count
    - lowest_pass_to_fail_count
    - lowest_total_charged_tokens
    - lowest_harness_version_id_lexicographic
  selectedArtifactsPerMethod: 1

internalSelectionPacket:
  creationTime: during_single_gate_transaction_after_candidate_evaluations
  readableUntilConfirmatoryFinalizationBy:
    - promoter
    - audit_store
  prohibitedUntilConfirmatoryFinalization:
    - proposer
    - runtime_developer
    - protocol_author
    - benchmark_author
    - model_selection_personnel
    - evolution_reporter
  proposerMayConsumeForNewCandidate: false
  maximumPacketsPerMethod: 1
  fields:
    - candidate_count
    - selected_harness_version_id
    - aggregate_pass_count_by_candidate
    - pass_to_fail_count_by_candidate
    - fail_to_pass_count_by_candidate
    - total_charged_tokens_by_candidate
    - provider_cost_micros_by_candidate
    - violation_count_by_class
    - selection_reason_codes
  forbiddenFields:
    - task_ids
    - task_text
    - paths
    - per_task_outcomes
    - traces
    - verifier_diagnostics
    - ground_truth_labels

postConfirmatoryRelease:
  allowedOnlyAfter:
    - all_final_evaluations_irrevocably_finalized
    - audit_heads_published
    - protocol_closed_to_candidate_or_method_changes
  releaseMakesGateExploratoryForSubsequentWork: true
  newConfirmatoryWorkRequiresFreshGateSplit: true

feedbackAccounting:
  adaptiveFeedbackEventsConsumedByCandidateGenerator: 0
  evaluationResultsChargedToMethodBudgetPerCandidate: 1
  selectionPacketChargedToMethodBudget: 1
  failedAndCancelledEvaluationRecordsCharged: true
  maximumDecisionEvidenceEventsPerMethod: 6
  auditRetentionRecordsAreAdaptiveFeedback: false
  auditRetentionRecordsStillRequired: true
  recordEveryAccessRecipientFieldAndReleaseTime: true

violation:
  additionalGateUnlockInvalidatesProtocolRun: true
  additionalGateQueryInvalidatesProtocolRun: true
  proposerAccessInvalidatesProtocolRun: true
  preFinalDeveloperOrProtocolAuthorAccessInvalidatesProtocolRun: true
  taskLevelLeakInvalidatesProtocolRun: true
  reuseAfterHumanReleaseInvalidatesConfirmatoryStatus: true
