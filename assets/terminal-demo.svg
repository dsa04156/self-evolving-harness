<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">SEH interactive coding-agent terminal</title>
  <description id="description">The SEH terminal home screen with its task-execution loop, harness-evolution loop, immutable trust boundary, and prompt composer.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#background)"/>
  <circle cx="1040" cy="40" r="280" fill="#6d28d9" opacity="0.08"/>
  <circle cx="130" cy="720" r="260" fill="#0891b2" opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="42" y="38" width="1116" height="684" rx="18" fill="#090e17" stroke="#263247" stroke-width="2"/>
    <rect x="42" y="38" width="1116" height="46" rx="18" fill="#151d2a"/>
    <rect x="42" y="66" width="1116" height="18" fill="#151d2a"/>
    <circle cx="70" cy="61" r="6" fill="#fb7185"/>
    <circle cx="91" cy="61" r="6" fill="#fbbf24"/>
    <circle cx="112" cy="61" r="6" fill="#34d399"/>
    <text x="600" y="67" text-anchor="middle" fill="#7f8da3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">seh — self-evolving-harness</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="72" y="108" width="1056" height="82" rx="12" fill="#0c131f" stroke="#28364a"/>
    <rect x="72" y="108" width="5" height="82" rx="3" fill="url(#accent)"/>
    <text x="98" y="141" fill="#67e8f9" font-size="22" font-weight="700">SEH</text>
    <text x="154" y="141" fill="#718096" font-size="13">v0.7.0</text>
    <text x="223" y="141" fill="#f1f5f9" font-size="15" font-weight="700">SELF-EVOLVING CODING AGENT</text>
    <text x="98" y="170" fill="#67e8f9" font-size="13">my-project</text>
    <text x="680" y="170" fill="#c4b5fd" font-size="12">openai/gpt-5.6-sol</text>
    <text x="845" y="170" fill="#475569" font-size="12">·</text>
    <text x="861" y="170" fill="#fbbf24" font-size="12">HIGH</text>
    <text x="901" y="170" fill="#475569" font-size="12">·</text>
    <text x="917" y="170" fill="#4ade80" font-size="12" font-weight="700">FAST</text>
    <text x="955" y="170" fill="#475569" font-size="12">·</text>
    <text x="971" y="170" fill="#6ee7b7" font-size="12">WRITE · AGENTS 4</text>

    <g text-anchor="middle">
      <text x="600" y="241" fill="#67e8f9" font-size="18" font-weight="700">●  ╭────────  TASK EXECUTION  ────────╮  ·</text>
      <text x="600" y="273" fill="#718096" font-size="14">context  →  model  →  tools  →  verification</text>
      <text x="600" y="311" fill="#cbd5e1" font-size="18" font-weight="700">╲          ◈  S E H  ◈          ╱</text>
      <text x="600" y="349" fill="#718096" font-size="14">traces  →  attribution  →  version  →  evaluation</text>
      <text x="600" y="381" fill="#c084fc" font-size="18" font-weight="700">·  ╰───────  HARNESS EVOLUTION  ───────╯  ●</text>
      <rect x="287" y="405" width="626" height="42" rx="21" fill="#111827" stroke="#fbbf24" stroke-opacity="0.5"/>
      <text x="600" y="432" fill="#fbbf24" font-size="13" font-weight="700">◆  IMMUTABLE TRUST</text>
      <text x="760" y="432" fill="#718096" font-size="12">evaluator · policy · audit ·</text>
      <text x="870" y="432" fill="#4ade80" font-size="12" font-weight="700">LOCKED</text>
    </g>

    <text x="600" y="490" text-anchor="middle" fill="#67e8f9" font-size="15" font-weight="700">Ready in my-project</text>
    <text x="600" y="516" text-anchor="middle" fill="#718096" font-size="12">describe a task or press  /</text>
    <text x="300" y="549" fill="#c084fc" font-size="12">/model</text>
    <text x="353" y="549" fill="#8fa0b7" font-size="12">route</text>
    <text x="415" y="549" fill="#c084fc" font-size="12">/agent</text>
    <text x="467" y="549" fill="#8fa0b7" font-size="12">delegate</text>
    <text x="560" y="549" fill="#c084fc" font-size="12">/resume</text>
    <text x="619" y="549" fill="#8fa0b7" font-size="12">history</text>
    <text x="684" y="549" fill="#c084fc" font-size="12">/review</text>
    <text x="736" y="549" fill="#8fa0b7" font-size="12">diff</text>
    <text x="780" y="549" fill="#c084fc" font-size="12">/tools</text>
    <text x="825" y="549" fill="#8fa0b7" font-size="12">authority</text>

    <rect x="78" y="588" width="1044" height="72" rx="12" fill="#0d1420" stroke="#22d3ee"/>
    <text x="103" y="632" fill="#67e8f9" font-size="20" font-weight="700">❯</text>
    <rect x="134" y="607" width="2" height="31" fill="#67e8f9" filter="url(#glow)"/>
    <text x="92" y="688" fill="#607087" font-size="11">Shift+Enter newline · PageUp transcript · / commands</text>
    <text x="1092" y="688" text-anchor="end" fill="#6ee7b7" font-size="11">ready</text>
  </g>
</svg>
