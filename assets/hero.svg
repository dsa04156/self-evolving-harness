<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Self-Evolving Harness architecture</title>
  <description id="description">Two separate loops for task execution and harness evolution connected by a versioned harness and constrained by an immutable trust plane.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.55" stop-color="#0d1d2c"/>
      <stop offset="1" stop-color="#102637"/>
    </linearGradient>
    <linearGradient id="task" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="evolution" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="trust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172a3a"/>
      <stop offset="0.5" stop-color="#20374b"/>
      <stop offset="1" stop-color="#172a3a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="taskArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4"/>
    </marker>
    <marker id="evolutionArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <g opacity="0.22" fill="#8db3cc">
    <circle cx="58" cy="55" r="2"/><circle cx="112" cy="87" r="1.5"/><circle cx="181" cy="44" r="1"/>
    <circle cx="1020" cy="58" r="1.5"/><circle cx="1094" cy="92" r="2"/><circle cx="1152" cy="51" r="1"/>
    <circle cx="298" cy="349" r="1.5"/><circle cx="904" cy="354" r="1.5"/>
  </g>

  <text x="600" y="54" text-anchor="middle" fill="#d9e8f2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="4">TWO LOOPS · ONE GOVERNED RUNTIME</text>

  <g>
    <rect x="58" y="84" width="440" height="210" rx="22" fill="#0b1a26" stroke="#285363" stroke-width="1.5"/>
    <rect x="78" y="104" width="144" height="30" rx="15" fill="#113439"/>
    <circle cx="96" cy="119" r="5" fill="#5eead4" filter="url(#glow)"/>
    <text x="111" y="124" fill="#9ff3e5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">TASK LOOP</text>

    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" text-anchor="middle">
      <rect x="82" y="168" width="82" height="42" rx="11" fill="#102933" stroke="#2b756f"/>
      <text x="123" y="194" fill="#d9fff8">Context</text>
      <rect x="190" y="168" width="82" height="42" rx="11" fill="#102933" stroke="#2b756f"/>
      <text x="231" y="194" fill="#d9fff8">Model</text>
      <rect x="298" y="168" width="82" height="42" rx="11" fill="#102933" stroke="#2b756f"/>
      <text x="339" y="194" fill="#d9fff8">Tools</text>
      <rect x="406" y="168" width="68" height="42" rx="11" fill="#102933" stroke="#2b756f"/>
      <text x="440" y="194" fill="#d9fff8">Verify</text>
    </g>
    <g fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#taskArrow)">
      <path d="M164 189 H186"/>
      <path d="M272 189 H294"/>
      <path d="M380 189 H402"/>
      <path d="M440 216 C440 256 123 256 123 216" opacity="0.72"/>
    </g>
    <text x="278" y="270" text-anchor="middle" fill="#7899a8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">complete or bounded retry · same HarnessVersion</text>
  </g>

  <g>
    <rect x="702" y="84" width="440" height="210" rx="22" fill="#0b1a26" stroke="#344a76" stroke-width="1.5"/>
    <rect x="722" y="104" width="174" height="30" rx="15" fill="#19243e"/>
    <circle cx="740" cy="119" r="5" fill="#818cf8" filter="url(#glow)"/>
    <text x="755" y="124" fill="#c7d2fe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">EVOLUTION LOOP</text>

    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" text-anchor="middle">
      <rect x="726" y="168" width="82" height="42" rx="11" fill="#151e38" stroke="#5964a9"/>
      <text x="767" y="194" fill="#eef0ff">Traces</text>
      <rect x="834" y="168" width="82" height="42" rx="11" fill="#151e38" stroke="#5964a9"/>
      <text x="875" y="194" fill="#eef0ff">Attribute</text>
      <rect x="942" y="168" width="82" height="42" rx="11" fill="#151e38" stroke="#5964a9"/>
      <text x="983" y="194" fill="#eef0ff">Mutate</text>
      <rect x="1050" y="168" width="68" height="42" rx="11" fill="#151e38" stroke="#5964a9"/>
      <text x="1084" y="194" fill="#eef0ff">Gate</text>
    </g>
    <g fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#evolutionArrow)">
      <path d="M808 189 H830"/>
      <path d="M916 189 H938"/>
      <path d="M1024 189 H1046"/>
      <path d="M1084 216 C1084 256 767 256 767 216" opacity="0.72"/>
    </g>
    <text x="922" y="270" text-anchor="middle" fill="#8491b4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">new candidate · independent evaluation · signed decision</text>
  </g>

  <g>
    <rect x="512" y="119" width="176" height="138" rx="24" fill="#122635" stroke="#66859a" stroke-width="1.5"/>
    <path d="M600 142 l29 11 v27 c0 23-12 42-29 51-17-9-29-28-29-51v-27z" fill="#18394a" stroke="url(#evolution)" stroke-width="2"/>
    <path d="M586 180 l10 10 19-22" fill="none" stroke="url(#task)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="600" y="239" text-anchor="middle" fill="#e8f3f8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">VERSIONED HARNESS</text>
  </g>

  <path d="M498 189 H508" stroke="#66859a" stroke-width="2"/>
  <path d="M688 189 H698" stroke="#66859a" stroke-width="2"/>

  <g>
    <rect x="58" y="320" width="1084" height="62" rx="18" fill="url(#trust)" stroke="#39566a"/>
    <text x="600" y="347" text-anchor="middle" fill="#e3edf3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="750" letter-spacing="2.2">IMMUTABLE TRUST PLANE</text>
    <text x="600" y="369" text-anchor="middle" fill="#89a6b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5">evaluator · sealed data · permissions · safety · budgets · model identity · audit · promotion policy</text>
  </g>
</svg>
