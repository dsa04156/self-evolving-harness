<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HarnessVersion Lifecycle</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --page:#f5f7fa; --paper:#fff; --ink:#162033; --muted:#657186; --line:#9da9bb; --blue:#2563eb; --blue-soft:#eaf1ff; --amber:#c86b08; --amber-soft:#fff3df; --dark:#1f2937; --red:#b42318; --red-soft:#fff0ee; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:1220px; background:var(--page); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:1200px; margin:32px auto; padding:32px 40px 40px; background:var(--paper); border:1px solid #dbe1ea; }
    h1 { margin:0 0 8px; font-size:28px; letter-spacing:-.02em; }
    .dek { margin:0 0 24px; color:var(--muted); font-size:15px; }
    svg { width:1120px; height:660px; display:block; }
    .edge { fill:none; stroke:var(--line); stroke-width:1.8; }
    .edge.decision { stroke:var(--amber); }
    .edge.fail { stroke:var(--red); }
    .state { fill:#fff; stroke:#b8c1cf; stroke-width:1.5; }
    .state.primary { fill:var(--blue-soft); stroke:var(--blue); }
    .state.decision { fill:var(--amber-soft); stroke:var(--amber); }
    .state.fail { fill:var(--red-soft); stroke:var(--red); }
    .state.terminal { fill:var(--dark); stroke:var(--dark); }
    .name { font-size:14px; font-weight:720; fill:var(--ink); text-anchor:middle; }
    .name.light { fill:#fff; }
    .sub { font-size:11px; fill:var(--muted); text-anchor:middle; }
    .label { font-size:11px; font-weight:650; fill:#667287; text-anchor:middle; }
    .note { font-size:12px; fill:var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>HarnessVersion Lifecycle</h1>
  <p class="dek">Every mutation becomes a separate version and must pass static, evaluation, canary, and audited decision gates.</p>
  <svg viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
    <title id="title">Harness version state machine</title>
    <desc id="desc">A harness progresses from draft to active through validation and evaluation. It may be rejected or rolled back, with retired as terminal archival state.</desc>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9da9bb"/></marker>
      <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c86b08"/></marker>
      <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker>
    </defs>

    <g aria-hidden="true">
      <path class="edge" marker-end="url(#arrow)" d="M164 104 H204"/>
      <path class="edge" marker-end="url(#arrow)" d="M348 104 H388"/>
      <path class="edge" marker-end="url(#arrow)" d="M556 104 H596"/>
      <path class="edge decision" marker-end="url(#arrow-amber)" d="M740 104 H780"/>
      <path class="edge decision" marker-end="url(#arrow-amber)" d="M924 104 H964"/>
      <path class="edge" marker-end="url(#arrow)" d="M1036 144 V352 H960"/>
      <path class="edge fail" marker-end="url(#arrow-red)" d="M276 144 V256 H480"/>
      <path class="edge fail" marker-end="url(#arrow-red)" d="M472 144 V256"/>
      <path class="edge fail" marker-end="url(#arrow-red)" d="M668 144 V256 H560"/>
      <path class="edge fail" marker-end="url(#arrow-red)" d="M852 144 V256 H560"/>
      <path class="edge" marker-end="url(#arrow)" d="M480 336 V392 H888"/>
      <path class="edge fail" marker-end="url(#arrow-red)" d="M964 104 H944 V456 H740"/>
      <path class="edge" marker-end="url(#arrow)" d="M668 496 H600 V432 H888"/>
    </g>

    <g>
      <rect class="state" x="20" y="64" width="144" height="80" rx="8"/>
      <text class="name" x="92" y="99">draft</text>
      <text class="sub" x="92" y="121">manifest created</text>

      <rect class="state" x="204" y="64" width="144" height="80" rx="8"/>
      <text class="name" x="276" y="99">candidate</text>
      <text class="sub" x="276" y="121">parent unchanged</text>

      <rect class="state" x="388" y="64" width="168" height="80" rx="8"/>
      <text class="name" x="472" y="99">statically_validated</text>
      <text class="sub" x="472" y="121">schema · DAG · immutable diff</text>

      <rect class="state primary" x="596" y="64" width="144" height="80" rx="8"/>
      <text class="name" x="668" y="99">evaluating</text>
      <text class="sub" x="668" y="121">matched parent pair</text>

      <rect class="state decision" x="780" y="64" width="144" height="80" rx="8"/>
      <text class="name" x="852" y="99">canary</text>
      <text class="sub" x="852" y="121">new cohort only</text>

      <rect class="state primary" x="964" y="64" width="144" height="80" rx="8"/>
      <text class="name" x="1036" y="99">active</text>
      <text class="sub" x="1036" y="121">external rollback target + CAS</text>

      <rect class="state fail" x="400" y="256" width="160" height="80" rx="8"/>
      <text class="name" x="480" y="291">rejected</text>
      <text class="sub" x="480" y="313">preserve proposal + result</text>

      <rect class="state fail" x="596" y="456" width="144" height="80" rx="8"/>
      <text class="name" x="668" y="491">rolled_back</text>
      <text class="sub" x="668" y="513">target hash restored</text>

      <rect class="state terminal" x="888" y="352" width="160" height="80" rx="8"/>
      <text class="name light" x="968" y="387">retired</text>
      <text class="sub" x="968" y="409" fill="#d7deea">terminal archive</text>

      <text class="label" x="184" y="94">propose</text>
      <text class="label" x="368" y="94">static pass</text>
      <text class="label" x="576" y="94">admit</text>
      <text class="label" x="760" y="94">gate pass</text>
      <text class="label" x="944" y="94">promote CAS</text>
      <text class="label" x="998" y="238">supersede</text>
      <text class="label" x="650" y="240">any gate failure</text>
      <text class="label" x="826" y="474">rollback decision</text>
      <text class="label" x="774" y="416">archive</text>

      <text class="note" x="20" y="592">No direct candidate → active edge. A stale evaluated parent causes CAS failure and requires re-evaluation or rejection.</text>
      <text class="note" x="20" y="616">Rejected and rolled-back versions are retained; session retry, restart, recovery, or prompt reinjection never enters this machine.</text>
    </g>
  </svg>
</main>
</body>
</html>
