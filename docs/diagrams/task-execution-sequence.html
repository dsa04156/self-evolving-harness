<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Execution Loop — Sequence</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --page:#f5f7fa; --paper:#fff; --ink:#162033; --muted:#657186; --line:#aeb8c8; --blue:#2563eb; --blue-soft:#eaf1ff; --amber:#c86b08; --amber-soft:#fff3df; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:1220px; background:var(--page); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:1200px; margin:32px auto; padding:32px 40px 40px; background:var(--paper); border:1px solid #dbe1ea; }
    h1 { margin:0 0 8px; font-size:28px; letter-spacing:-.02em; }
    .dek { margin:0 0 24px; color:var(--muted); font-size:15px; }
    svg { width:1120px; height:820px; display:block; }
    .lifeline { stroke:#c7cfdb; stroke-width:1.5; stroke-dasharray:5 6; }
    .message { stroke:#748197; stroke-width:1.7; fill:none; }
    .return { stroke:#748197; stroke-width:1.5; fill:none; stroke-dasharray:6 5; }
    .verify { stroke:var(--amber); stroke-width:1.8; fill:none; }
    .head { fill:#fff; stroke:#b8c1cf; stroke-width:1.5; }
    .head.primary { fill:var(--blue-soft); stroke:var(--blue); }
    .head.verify { fill:var(--amber-soft); stroke:var(--amber); }
    .activation { fill:#eaf1ff; stroke:var(--blue); stroke-width:1; }
    .label-bg { fill:#fff; }
    .head-text { font-size:14px; font-weight:720; fill:var(--ink); text-anchor:middle; }
    .msg { font-size:12px; font-weight:620; fill:#465267; text-anchor:middle; }
    .note { fill:#f8fafc; stroke:#b8c1cf; stroke-width:1.2; }
    .note.amber { fill:var(--amber-soft); stroke:var(--amber); }
    .note-title { font-size:13px; font-weight:720; fill:var(--ink); }
    .note-copy { font-size:12px; fill:var(--muted); }
    .phase { font-size:11px; font-weight:760; letter-spacing:.08em; fill:var(--blue); }
  </style>
</head>
<body>
<main>
  <h1>Task Execution Loop</h1>
  <p class="dek">One session, one pinned HarnessVersion; retries and recovery never create a candidate.</p>
  <svg viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
    <title id="title">Task execution sequence diagram</title>
    <desc id="desc">Operations starts a pinned session. The kernel builds context, invokes a model, authorizes tools, and asks a fixed verifier before completion or retry.</desc>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#748197"/></marker>
      <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c86b08"/></marker>
    </defs>

    <g aria-hidden="true">
      <line class="lifeline" x1="112" y1="100" x2="112" y2="748"/>
      <line class="lifeline" x1="336" y1="100" x2="336" y2="748"/>
      <line class="lifeline" x1="560" y1="100" x2="560" y2="748"/>
      <line class="lifeline" x1="784" y1="100" x2="784" y2="748"/>
      <line class="lifeline" x1="1008" y1="100" x2="1008" y2="748"/>
      <path class="message" marker-end="url(#arrow)" d="M112 156 H328"/>
      <path class="return" marker-end="url(#arrow)" d="M328 204 H120"/>
      <path class="message" marker-end="url(#arrow)" d="M112 252 H328"/>
      <path class="message" marker-end="url(#arrow)" d="M336 316 H552"/>
      <path class="return" marker-end="url(#arrow)" d="M552 372 H344"/>
      <path class="message" marker-end="url(#arrow)" d="M560 432 H776"/>
      <path class="return" marker-end="url(#arrow)" d="M776 488 H568"/>
      <path class="message" marker-end="url(#arrow)" d="M336 540 H552"/>
      <path class="verify" marker-end="url(#arrow-amber)" d="M336 604 H1000"/>
      <path class="verify" marker-end="url(#arrow-amber)" d="M1000 660 H344"/>
      <path class="message" marker-end="url(#arrow)" d="M336 716 H120"/>
    </g>

    <g>
      <rect class="head" x="24" y="48" width="176" height="52" rx="8"/>
      <text class="head-text" x="112" y="79">Operations Owner</text>
      <rect class="head primary" x="248" y="48" width="176" height="52" rx="8"/>
      <text class="head-text" x="336" y="79">Runtime Kernel</text>
      <rect class="head" x="472" y="48" width="176" height="52" rx="8"/>
      <text class="head-text" x="560" y="79">Model Provider</text>
      <rect class="head" x="696" y="48" width="176" height="52" rx="8"/>
      <text class="head-text" x="784" y="79">Tool Broker</text>
      <rect class="head verify" x="920" y="48" width="176" height="52" rx="8"/>
      <text class="head-text" x="1008" y="79">Fixed Verifier</text>

      <rect class="activation" x="328" y="148" width="16" height="580"/>
      <rect class="activation" x="552" y="308" width="16" height="188"/>
      <rect class="activation" x="776" y="424" width="16" height="72"/>
      <rect x="1000" y="596" width="16" height="72" fill="#fff3df" stroke="#c86b08"/>

      <rect class="label-bg" x="170" y="137" width="108" height="22"/>
      <text class="msg" x="224" y="152">start(session)</text>
      <rect class="label-bg" x="164" y="185" width="120" height="22"/>
      <text class="msg" x="224" y="200">pinned harness + state snapshot</text>
      <rect class="label-bg" x="150" y="233" width="148" height="22"/>
      <text class="msg" x="224" y="248">submit(task input)</text>
      <rect class="label-bg" x="404" y="297" width="88" height="22"/>
      <text class="msg" x="448" y="312">context + tools</text>
      <rect class="label-bg" x="400" y="353" width="96" height="22"/>
      <text class="msg" x="448" y="368">streamed items</text>
      <rect class="label-bg" x="624" y="413" width="96" height="22"/>
      <text class="msg" x="672" y="428">tool call args</text>
      <rect class="label-bg" x="612" y="469" width="120" height="22"/>
      <text class="msg" x="672" y="484">authorized result</text>
      <rect class="label-bg" x="392" y="521" width="112" height="22"/>
      <text class="msg" x="448" y="536">tool result item</text>
      <rect class="label-bg" x="600" y="585" width="144" height="22"/>
      <text class="msg" x="672" y="600">validate terminal result</text>
      <rect class="label-bg" x="596" y="641" width="152" height="22"/>
      <text class="msg" x="672" y="656">verifier outcome record</text>
      <rect class="label-bg" x="166" y="697" width="116" height="22"/>
      <text class="msg" x="224" y="712">state + evidence</text>

      <text class="phase" x="24" y="132">INITIALIZE</text>
      <text class="phase" x="24" y="292">EXECUTE</text>
      <text class="phase" x="24" y="580">VERIFY</text>

      <rect class="note" x="692" y="244" width="404" height="92" rx="8"/>
      <text class="note-title" x="712" y="270">Context receipt</text>
      <text class="note-copy" x="712" y="292">Selected and rejected source IDs, component hashes,</text>
      <text class="note-copy" x="712" y="312">memory snapshot, budget and permission versions.</text>

      <rect class="note amber" x="700" y="696" width="396" height="72" rx="8"/>
      <text class="note-title" x="720" y="722">Failure path</text>
      <text class="note-copy" x="720" y="744">retry → running; fault → recovering; missing authority → blocked.</text>
    </g>
  </svg>
</main>
</body>
</html>
