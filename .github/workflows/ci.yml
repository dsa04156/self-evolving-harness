name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  product-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - run: npm ci
      - run: npm run check
      - run: npm run test:product
